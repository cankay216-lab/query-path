# Publishes the Query Path website on GitHub Pages and refreshes its data every morning.
# - On every push to main: publishes the site as it is.
# - Every day at about 05:15 Polish time (and when started by hand): refreshes the job
#   openings and beginner GitHub issues, saves them in the repository, then publishes.
name: Refresh and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refresh job openings
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/refresh-jobs.mjs

      - name: Refresh beginner GitHub issues
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-oss.mjs

      - name: Save refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
