<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Query Path</title>
<meta name="description" content="SQL practice, portfolio projects, coach and job search for a first SQL job.">
<meta name="theme-color" content="#2443c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Query Path">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script async src="vendor/sql-asm.js"></script>
<style>
/* Layout idea: a working notebook for SQL. Left rail of sections with live counters; a 12-cell week strip is the one bold element. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #f6f7f4;
  --ink: #131a2b;
  --muted: #5b6375;
  --line: #d9ddd6;
  --accent: #2443c9;
  --accent-ink: #ffffff;
  --accent-soft: #e4e9fb;
  --mark: #f0b429;
  --mark-soft: #fdf1d3;
  --good: #1f7a4d; --good-soft: #def2e6;
  --warn: #a35a00; --warn-soft: #fbead2;
  --bad: #b42318; --bad-soft: #fbe2df;
  --code-bg: #10172a; --code-ink: #e6e9f2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d111c; --surface: #151b2b; --surface-2: #1b2234; --ink: #e8ebf3; --muted: #9aa3b8; --line: #2a3247;
    --accent: #8ea2ff; --accent-ink: #0d111c; --accent-soft: #232d52; --mark: #f5c451; --mark-soft: #3a3016;
    --good: #5fd39a; --good-soft: #15352a; --warn: #f2b45a; --warn-soft: #3a2a12; --bad: #ff8a80; --bad-soft: #3d1c1c;
    --code-bg: #0a0e18; --code-ink: #e6e9f2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d111c; --surface: #151b2b; --surface-2: #1b2234; --ink: #e8ebf3; --muted: #9aa3b8; --line: #2a3247;
  --accent: #8ea2ff; --accent-ink: #0d111c; --accent-soft: #232d52; --mark: #f5c451; --mark-soft: #3a3016;
  --good: #5fd39a; --good-soft: #15352a; --warn: #f2b45a; --warn-soft: #3a2a12; --bad: #ff8a80; --bad-soft: #3d1c1c;
  --code-bg: #0a0e18; --code-ink: #e6e9f2; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; font-weight: 650; letter-spacing: -0.01em; }
h1 { font-size: 34px; } h2 { font-size: 22px; } h3 { font-size: 17px; } h4 { font-size: 15px; }
p { margin: 0; }
code, kbd, .mono { font-family: var(--font-mono); font-size: 0.92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 236px 1fr; height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 14px 16px; gap: 18px; overflow-y: auto; }
.brand { padding: 0 8px; display: grid; gap: 2px; }
.brand b { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.02em; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.nav a .ct { font: 12px var(--font-mono); color: var(--muted); }
.nav a.on .ct { color: var(--accent); }
.nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
.rail-foot { margin-top: auto; padding: 0 8px; display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
.save { display: inline-flex; align-items: center; gap: 6px; }
.save i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.save.cloud i { background: var(--good); } .save.local i { background: var(--mark); } .save.busy i { background: var(--accent); }

main { overflow-y: auto; min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; padding: 32px 28px 64px; display: grid; gap: 24px; }
.page.wide { max-width: 1320px; }
.head { display: grid; gap: 6px; }
.eyebrow { font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.lede { color: var(--muted); max-width: 68ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; align-content: start; }
.card.tight { padding: 14px 16px; gap: 8px; }
.card.flat { background: var(--surface-2); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; }
.muted { color: var(--muted); } .small { font-size: 13px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.55; cursor: default; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.mark { background: var(--mark-soft); color: var(--warn); border-color: transparent; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
button.chip { cursor: pointer; }
button.chip.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* Week strip: the signature element */
.weeks { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.wk { border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px 6px; background: var(--surface); display: grid; gap: 6px; text-decoration: none; color: var(--ink); min-height: 66px; position: relative; }
.wk b { font: 600 12px var(--font-mono); color: var(--muted); }
.wk .fill { margin-top: auto; height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.wk .fill i { display: block; height: 100%; background: var(--accent); }
.wk.done { background: var(--accent-soft); border-color: transparent; }
.wk.done b { color: var(--accent); }
.wk.now { border: 2px solid var(--mark); background: var(--mark-soft); }
.wk.now b { color: var(--warn); }
.wk span { font-size: 11.5px; line-height: 1.25; color: var(--muted); }

.hero { display: grid; gap: 18px; padding: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.hero h1 { font-size: 38px; max-width: 24ch; }
.stat { display: grid; gap: 2px; }
.stat b { font: 600 28px var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }

.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.check:last-child { border-bottom: 0; }
.check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.check label { flex: 1; cursor: pointer; }
.check.done label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.check .go { font-size: 12.5px; }

label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=url], input[type=email], input[type=date], input[type=number], select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 400; color: var(--ink); }
textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* Lab */
.lab { display: grid; grid-template-columns: 250px minmax(0, 1fr) 250px; gap: 16px; align-items: start; }
.exlist { display: grid; gap: 14px; max-height: calc(100vh - 140px); overflow-y: auto; position: sticky; top: 16px; padding-right: 4px; }
.exgroup h4 { font-size: 13px; display: flex; justify-content: space-between; color: var(--muted); font-family: var(--font-body); font-weight: 600; margin-bottom: 4px; }
.ex { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 6px 8px; border-radius: 7px; border: 0; background: none; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.ex:hover { background: var(--surface); }
.ex.on { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.ex .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-size: 10px; }
.ex.solved .dot { background: var(--good); border-color: var(--good); color: #fff; }
.lvl { font: 11px var(--font-mono); color: var(--muted); margin-left: auto; }
.editor { width: 100%; min-height: 200px; font: 14px/1.6 var(--font-mono); background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; tab-size: 2; resize: vertical; }
.editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.results { overflow: auto; max-height: 380px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.t th { position: sticky; top: 0; background: var(--surface-2); font: 600 12px var(--font-mono); color: var(--muted); }
table.t td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; }
table.t td.null { color: var(--muted); font-style: italic; }
.verdict { padding: 10px 14px; border-radius: 8px; font-weight: 500; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.verdict.info { background: var(--surface-2); color: var(--muted); }
pre.code { background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font: 13px/1.55 var(--font-mono); margin: 0; white-space: pre; }
.schema details { border-bottom: 1px solid var(--line); padding: 6px 0; }
.schema summary { cursor: pointer; font: 600 13px var(--font-mono); display: flex; justify-content: space-between; }
.schema ul { list-style: none; padding: 4px 0 2px; margin: 0; display: grid; gap: 2px; }
.schema li { font-size: 12px; display: flex; justify-content: space-between; gap: 6px; }
.schema li button { font: 12px var(--font-mono); border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.schema li span { color: var(--muted); text-align: right; }

/* Markdown output */
.md { display: grid; gap: 10px; line-height: 1.6; }
.md h1, .md h2, .md h3 { font-size: 16px; margin-top: 4px; }
.md ul, .md ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.md code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0; }
.md pre code { background: none; padding: 0; color: inherit; }
.md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }

/* Coach */
.chat { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; min-height: calc(100vh - 210px); }
.msgs { display: grid; gap: 14px; align-content: start; overflow-y: auto; max-height: calc(100vh - 330px); padding: 4px; }
.msg { max-width: 82%; padding: 12px 16px; border-radius: 12px; }
.msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.bot { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.composer textarea { min-height: 54px; max-height: 220px; }
.modes { display: flex; gap: 6px; flex-wrap: wrap; }

/* Jobs */
.pipe { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.pipe button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.pipe button b { font: 600 22px var(--font-display); font-variant-numeric: tabular-nums; }
.pipe button span { font-size: 12px; color: var(--muted); }
.pipe button.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.jobrow { display: grid; grid-template-columns: minmax(0, 2fr) 150px 110px 120px auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.jobrow:last-child { border-bottom: 0; }
.jobrow.feedrow { grid-template-columns: minmax(0, 1.6fr) minmax(0, 2fr) auto; padding: 12px 0; }
.toolnote { font: 12px var(--font-mono); color: var(--muted); }
.jobrow .who b { display: block; }
.jobrow select { padding: 5px 8px; font-size: 13px; }
.overdue { color: var(--bad); font-weight: 600; }
.st-saved { } .st-applied { color: var(--accent); } .st-screen, .st-tech, .st-final { color: var(--warn); } .st-offer { color: var(--good); } .st-rejected { color: var(--muted); }

/* Projects */
.proj { display: grid; gap: 10px; text-decoration: none; color: var(--ink); }
.proj:hover { border-color: var(--muted); }
.proj .code { font: 600 12px var(--font-mono); color: var(--accent); }
.step { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.step > summary { list-style: none; display: flex; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
.step > summary::-webkit-details-marker { display: none; }
.step .n { font: 600 12px var(--font-mono); color: var(--muted); width: 22px; }
.step .tt { flex: 1; font-weight: 600; }
.step.done .tt { color: var(--muted); text-decoration: line-through; }
.step .body { padding: 0 14px 14px 48px; display: grid; gap: 8px; }
.step input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }

.dialog { position: fixed; inset: 0; background: rgba(10, 14, 24, 0.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog .card { max-width: 440px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: calc(100vh - 32px); overflow-y: auto; }
.dialog .card.wide { max-width: 680px; }
#installBtn { justify-self: start; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 60; }
.preview { width: 100%; height: 620px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.thinking { color: var(--muted); font-style: italic; }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

@media (max-width: 1100px) {
  .lab { grid-template-columns: 220px minmax(0, 1fr); }
  .lab .schema-col { grid-column: 1 / -1; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; align-items: center; padding: 10px 12px; gap: 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
  .brand small, .rail-foot, .nav .sep { display: none; }
  .nav { display: flex; gap: 2px; }
  .nav a { white-space: nowrap; padding: 6px 10px; }
  .nav a .ct { display: none; }
  .page { padding: 20px 16px 48px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .lab { grid-template-columns: 1fr; }
  .exlist { position: static; max-height: 260px; }
  .weeks { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .pipe { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .jobrow, .jobrow.feedrow { grid-template-columns: 1fr; }
  .hero h1 { font-size: 28px; }
  .msg { max-width: 94%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>

  <aside class="rail">
    <div class="brand"><b>Query<span>.</span>Path</b><small id="forName">SQL career studio</small></div>

    <div class="rail-foot"><button class="btn sm" id="installBtn" data-act="install" hidden>Install app</button><span class="save" id="saveState"><i></i>Loading…</span><span id="backupState"></span></div>

  <main id="main"></main>

<script>
// ---------- Practice database: "Sklep Wisła", a fictional Polish online shop ----------
// Generated deterministically so every exercise has a stable, checkable answer.
function buildSeedSQL() {
  let s = 20240917;
  const rnd = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const wpick = (pairs) => { const tot = pairs.reduce((x, p) => x + p[1], 0); let r = rnd() * tot; for (const p of pairs) { if ((r -= p[1]) <= 0) return p[0]; } return pairs[0][0]; };
  const q = (v) => v === null ? 'NULL' : typeof v === 'number' ? String(v) : "'" + String(v).replace(/'/g, "''") + "'";
  const fold = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L').toLowerCase();
  const pad = (n) => String(n).padStart(2, '0');
  const dstr = (d) => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  const out = [];

  out.push(`CREATE TABLE departments (
  department_id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  city TEXT NOT NULL
);`);
  out.push(`CREATE TABLE employees (
  employee_id INTEGER PRIMARY KEY,
  first_name TEXT NOT NULL,
  last_name TEXT NOT NULL,
  department_id INTEGER NOT NULL REFERENCES departments(department_id),
  manager_id INTEGER REFERENCES employees(employee_id),
  hire_date TEXT NOT NULL,
  salary NUMERIC NOT NULL
);`);
  out.push(`CREATE TABLE customers (
  customer_id INTEGER PRIMARY KEY,
  first_name TEXT NOT NULL,
  last_name TEXT NOT NULL,
  email TEXT NOT NULL,
  phone TEXT,
  city TEXT NOT NULL,
  signup_date TEXT NOT NULL
);`);
  out.push(`CREATE TABLE categories (
  category_id INTEGER PRIMARY KEY,
  name TEXT NOT NULL UNIQUE
);`);
  out.push(`CREATE TABLE products (
  product_id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  category_id INTEGER NOT NULL REFERENCES categories(category_id),
  price NUMERIC NOT NULL CHECK (price > 0),
  stock INTEGER NOT NULL DEFAULT 0,
  is_active INTEGER NOT NULL DEFAULT 1
);`);
  out.push(`CREATE TABLE orders (
  order_id INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL REFERENCES customers(customer_id),
  order_date TEXT NOT NULL,
  status TEXT NOT NULL CHECK (status IN ('delivered','shipped','cancelled','returned')),
  channel TEXT NOT NULL CHECK (channel IN ('web','mobile_app','marketplace'))
);`);
  out.push(`CREATE TABLE order_items (
  order_item_id INTEGER PRIMARY KEY,

  emps.forEach(e => out.push(`INSERT INTO employees VALUES (${e.map(q).join(',')});`));

  // Customers
  const fnF = ['Anna', 'Maria', 'Katarzyna', 'Małgorzata', 'Agnieszka', 'Barbara', 'Ewa', 'Magdalena', 'Joanna', 'Aleksandra', 'Zuzanna', 'Natalia', 'Monika', 'Karolina', 'Julia', 'Wiktoria', 'Dorota', 'Paulina', 'Kinga', 'Hanna'];
  const fnM = ['Piotr', 'Krzysztof', 'Andrzej', 'Tomasz', 'Paweł', 'Michał', 'Marcin', 'Jakub', 'Adam', 'Łukasz', 'Kamil', 'Mateusz', 'Szymon', 'Wojciech', 'Grzegorz', 'Bartosz', 'Dawid', 'Filip', 'Kacper', 'Jan'];
  const lnBase = [['Nowak', 'Nowak'], ['Kowalski', 'Kowalska'], ['Wiśniewski', 'Wiśniewska'], ['Wójcik', 'Wójcik'], ['Kowalczyk', 'Kowalczyk'], ['Kamiński', 'Kamińska'], ['Lewandowski', 'Lewandowska'], ['Zieliński', 'Zielińska'], ['Szymański', 'Szymańska'], ['Woźniak', 'Woźniak'], ['Dąbrowski', 'Dąbrowska'], ['Kozłowski', 'Kozłowska'], ['Jankowski', 'Jankowska'], ['Mazur', 'Mazur'], ['Kwiatkowski', 'Kwiatkowska'], ['Krawczyk', 'Krawczyk'], ['Piotrowski', 'Piotrowska'], ['Grabowski', 'Grabowska'], ['Nowakowski', 'Nowakowska'], ['Pawłowski', 'Pawłowska'], ['Michalski', 'Michalska'], ['Nowicki', 'Nowicka'], ['Adamczyk', 'Adamczyk'], ['Dudek', 'Dudek'], ['Zając', 'Zając'], ['Wieczorek', 'Wieczorek'], ['Jabłoński', 'Jabłońska'], ['Król', 'Król'], ['Majewski', 'Majewska'], ['Olszewski', 'Olszewska']];

    const phone = rnd() < 0.16 ? null : '+48 ' + (500 + Math.floor(rnd() * 299)) + ' ' + String(Math.floor(rnd() * 1000)).padStart(3, '0') + ' ' + String(Math.floor(rnd() * 1000)).padStart(3, '0');
    const signup = dstr(new Date(start + Math.pow(rnd(), 0.8) * (end - start)));

    const c = custs[src - 1];
    custs.push([id, c[1], c[2], c[3], c[4], c[5], '2026-' + pad(3 + (id % 5)) + '-1' + (id % 9)]);
  });
  custs.forEach(c => out.push(`INSERT INTO customers VALUES (${c.map(q).join(',')});`));

  // Categories & products
  const cats = ['Books', 'Coffee & Tea', 'Board Games', 'Stationery', 'Electronics'];
  cats.forEach((c, i) => out.push(`INSERT INTO categories VALUES (${i + 1},${q(c)});`));

    ['Lalka – Bolesław Prus (hardcover)', 1, 59.99], ['Wiedźmin: Ostatnie życzenie', 1, 44.9], ['Solaris – Stanisław Lem', 1, 39.9], ['Learning SQL, 3rd ed.', 1, 189.0], ['T-SQL Fundamentals', 1, 214.5], ['Pan Tadeusz (illustrated)', 1, 129.0], ['Kuchnia polska – cookbook', 1, 79.0], ['Data Visualisation Handbook', 1, 159.0], ['Bieguni – Olga Tokarczuk', 1, 49.9],

  prods.forEach((p, i) => {

    out.push(`INSERT INTO products VALUES (${i + 1},${q(p[0])},${p[1]},${p[2]},${Math.floor(rnd() * 120)},${inactive ? 0 : 1});`);
  });
  const sellable = prods.slice(0, prods.length - 4).map((p, i) => ({ id: i + 1, price: p[2], cat: p[1] }));

  // Orders: ~1600 between Jan 2024 and Oct 2026 with growth; 25 customers never order
  const neverOrder = new Set(); while (neverOrder.size < 25) neverOrder.add(1 + Math.floor(rnd() * 300));
  const buyers = custs.filter(c => !neverOrder.has(c[0]) && c[0] <= 300);
  const loyal = buyers.filter(() => rnd() < 0.18).map(c => c[0]);
  let oid = 1001, iid = 1;
  const oStart = Date.UTC(2024, 0, 1), oEnd = Date.UTC(2026, 9, 31);
  const orders = [];
  for (let n = 0; n < 1600; n++) {
    const t = oStart + Math.pow(rnd(), 0.75) * (oEnd - oStart);
    const date = dstr(new Date(t));
    let cid = rnd() < 0.45 ? pick(loyal) : pick(buyers)[0];
    const cust = custs[cid - 1];
    if (cust[6] > date) { cid = pick(loyal); }
    const status = date >= '2026-10-20' ? wpick([['shipped', 7], ['delivered', 2], ['cancelled', 1]]) : wpick([['delivered', 84], ['shipped', 2], ['cancelled', 8], ['returned', 6]]);
    const channel = wpick([['web', 50], ['mobile_app', date >= '2025-01-01' ? 35 : 18], ['marketplace', 20]]);

  }
  orders.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  // customer 42 gets a predictable history for the LAG exercise
  orders.forEach(o => {
    out.push(`INSERT INTO orders VALUES (${oid},${o[1]},${q(o[0])},${q(o[2])},${q(o[3])});`);
    const lines = wpick([[1, 45], [2, 30], [3, 17], [4, 8]]);
    const chosen = new Set();
    for (let l = 0; l < lines; l++) {
      let p = pick(sellable); let guard = 0;
      while (chosen.has(p.id) && guard++ < 10) p = pick(sellable);
      if (chosen.has(p.id)) continue; chosen.add(p.id);
      const qty = p.cat === 4 ? wpick([[1, 50], [2, 30], [3, 12], [5, 8]]) : wpick([[1, 80], [2, 17], [3, 3]]);
      const promo = rnd() < 0.12 ? 0.9 : 1;
      const unit = Math.round(p.price * promo * 100) / 100;
      out.push(`INSERT INTO order_items VALUES (${iid++},${oid},${p.id},${qty},${unit});`);
    }
    oid++;
  });
  return out.join('\n');
}

    solution: "SELECT c.customer_id, c.first_name, c.last_name\nFROM customers c\nWHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.order_date LIKE '2024%')\n  AND NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.order_date LIKE '2025%');",
    tsql: "Use YEAR(o.order_date) = 2024 or a date range instead of LIKE, since order_date would be a DATE column." },
  { id: 's3', topic: 'sub', level: 2, title: 'Big spenders (CTE)', ordered: true,
    prompt: 'Using a CTE, find customers whose total spend (excluding cancelled orders) is <b>more than twice the average customer spend</b>: customer_id, total_spent (2 decimals). Highest first.',
    hint: 'WITH spend AS (SELECT customer_id, SUM(...) ... GROUP BY customer_id) SELECT ... WHERE total > 2 * (SELECT AVG(total) FROM spend).',
    solution: "WITH spend AS (\n  SELECT o.customer_id, SUM(oi.quantity * oi.unit_price) AS total\n  FROM orders o\n  JOIN order_items oi ON oi.order_id = o.order_id\n  WHERE o.status <> 'cancelled'\n  GROUP BY o.customer_id\n)\nSELECT customer_id, ROUND(total, 2) AS total_spent\nFROM spend\nWHERE total > 2 * (SELECT AVG(total) FROM spend)\nORDER BY total_spent DESC;",
    tsql: 'Identical. CTEs work the same in SQL Server; remember the previous statement must end with a semicolon.' },
  { id: 's4', topic: 'sub', level: 2, title: 'Share of revenue', ordered: true,
    prompt: 'Each category\'s share of all revenue from delivered orders: category, revenue (2 decimals), pct (percentage, 1 decimal). Highest first.',
    hint: 'Compute category revenue, then divide by the grand total, using a subquery or SUM(...) OVER ().',
    solution: "WITH r AS (\n  SELECT c.name AS category, SUM(oi.quantity * oi.unit_price) AS revenue\n  FROM orders o\n  JOIN order_items oi ON oi.order_id = o.order_id\n  JOIN products p ON p.product_id = oi.product_id\n  JOIN categories c ON c.category_id = p.category_id\n  WHERE o.status = 'delivered'\n  GROUP BY c.name\n)\nSELECT category, ROUND(revenue, 2) AS revenue,\n       ROUND(100.0 * revenue / SUM(revenue) OVER (), 1) AS pct\nFROM r\nORDER BY revenue DESC;",
    tsql: 'Identical. Watch integer division: 100 * 3 / 7 is 42 in SQL Server if both are INT, so use 100.0.' },
  { id: 's5', topic: 'sub', level: 1, title: 'Never ordered (customers)', ordered: false,

  // WINDOW FUNCTIONS
  { id: 'w1', topic: 'win', level: 2, title: 'Price rank within category', ordered: false,
    prompt: 'Rank products by price <b>within each category</b> (most expensive = 1, equal prices share a rank with no gaps): category, name, price, price_rank.',
    hint: 'DENSE_RANK() OVER (PARTITION BY category ORDER BY price DESC).',
    solution: 'SELECT c.name AS category, p.name, p.price,\n       DENSE_RANK() OVER (PARTITION BY p.category_id ORDER BY p.price DESC) AS price_rank\nFROM products p\nJOIN categories c ON c.category_id = p.category_id;',
    tsql: 'Identical. Know the difference: ROW_NUMBER (1,2,3), RANK (1,1,3), DENSE_RANK (1,1,2).' },
  { id: 'w2', topic: 'win', level: 2, title: 'Running total 2025', ordered: true,
    prompt: 'Monthly revenue in 2025 (excluding cancelled and returned) with a <b>running total</b>: month, revenue, running_total (both 2 decimals). Chronological.',
    hint: 'Aggregate per month in a CTE, then SUM(revenue) OVER (ORDER BY month).',

    tsql: 'Add ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW. SQL Server defaults to RANGE, which is slower and behaves differently with ties.' },
  { id: 'w3', topic: 'win', level: 2, title: 'Gaps between orders', ordered: true,
    prompt: 'For customer <b>42</b>, list each order with the previous order\'s date and the days since it: order_id, order_date, previous_order_date, days_since_previous. Chronological.',

    solution: "SELECT order_id, order_date,\n       LAG(order_date) OVER (ORDER BY order_date, order_id) AS previous_order_date,\n       CAST(julianday(order_date) - julianday(LAG(order_date) OVER (ORDER BY order_date, order_id)) AS INTEGER) AS days_since_previous\nFROM orders\nWHERE customer_id = 42\nORDER BY order_date, order_id;",
    tsql: 'DATEDIFF(day, LAG(order_date) OVER (ORDER BY order_date, order_id), order_date).' },
  { id: 'w4', topic: 'win', level: 3, title: 'Top 3 per city', ordered: true,
    prompt: 'The <b>top 3 customers by spend in each city</b> (excluding cancelled orders; break ties by lower customer_id): city, customer_id, total_spent (2 decimals), rn. Sort by city, then rn.',

  { id: 'w5', topic: 'win', level: 3, title: 'Month-over-month change', ordered: true,

    hint: 'Monthly CTE, then LAG(revenue) OVER (ORDER BY month). pct = 100.0 * (rev - prev) / prev.',
    solution: "WITH m AS (\n  SELECT strftime('%Y-%m', o.order_date) AS month, SUM(oi.quantity * oi.unit_price) AS revenue\n  FROM orders o\n  JOIN order_items oi ON oi.order_id = o.order_id\n  WHERE o.order_date LIKE '2025%' AND o.status NOT IN ('cancelled', 'returned')\n  GROUP BY month\n)\nSELECT month, ROUND(revenue, 2) AS revenue,\n       ROUND(LAG(revenue) OVER (ORDER BY month), 2) AS prev_revenue,\n       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month)) / LAG(revenue) OVER (ORDER BY month), 1) AS pct_change\nFROM m\nORDER BY month;",

  { id: 'i5', topic: 'interview', level: 2, title: 'Best-paid department', ordered: false,

function mergeDefaults(def, val) {
  if (!val || typeof val !== 'object' || Array.isArray(def)) return val ?? clone(def);
  const out = clone(def);
  for (const k of Object.keys(val)) out[k] = (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k])) ? mergeDefaults(def[k], val[k]) : val[k];
  return out;
}

}

// ----- Small markdown renderer for coach answers (escapes everything first) -----
function md(src) {
  const blocks = [];
  let s = String(src || '').replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, (m, code) => { blocks.push(code.replace(/\n$/, '')); return '\n@@B' + (blocks.length - 1) + '@@\n'; });
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = s.split('\n'); const out = []; let list = null, para = [];
  const flushP = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map((i) => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`); list = null; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    let m;
    if ((m = l.match(/^@@B(\d+)@@$/))) { flushP(); flushL(); out.push('<pre><code>' + esc(blocks[+m[1]]) + '</code></pre>'); continue; }
    if (!l.trim()) { flushP(); flushL(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flushP(); flushL(); out.push('<h3>' + inline(m[1]) + '</h3>'); continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^>\s?(.*)/))) { flushP(); flushL(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
    if (list && /^\s{2,}/.test(raw)) { list.items[list.items.length - 1] += ' ' + l.trim(); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return out.join('');
}

function toast(msg, ms) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms || 2400);
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise((res) => {
    const d = document.createElement('div'); d.className = 'dialog';
    d.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x="0">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-x="1">${esc(okLabel || 'Confirm')}</button></div></div>`;
    const done = (v) => { d.remove(); res(v); };
    d.addEventListener('click', (e) => { const b = e.target.closest('[data-x]'); if (b) done(b.dataset.x === '1'); else if (e.target === d) done(false); });
    d.addEventListener('keydown', (e) => { if (e.key === 'Escape') done(false); });
    document.body.appendChild(d); $('[data-x="1"]', d).focus();
  });
}
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast((label || 'Text') + ' copied'); }
  catch (e) {
    const d = document.createElement('div'); d.className = 'dialog';
    d.innerHTML = `<div class="card"><h3>Copy this</h3><p class="muted small">Your browser blocked automatic copying. The text is selected: press Ctrl+C (or Cmd+C).</p><textarea id="cpyTa" style="min-height:200px">${esc(text)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn primary" data-x>Done</button></div></div>`;
    d.addEventListener('click', (ev) => { if (ev.target.closest('[data-x]') || ev.target === d) d.remove(); });
    document.body.appendChild(d); const ta = $('#cpyTa', d); ta.focus(); ta.select();
  }
}

      <div id="labOut">${ui.labOut.sandbox || '<div class="verdict info">Run a query to see results here.</div>'}</div>
      <div class="card tight"><h4>My scripts</h4>${scripts.length ? scripts.map((s) => `<div class="row between check"><span><b>${esc(s.name)}</b> <span class="muted small">· ${fmtDate(s.at)}</span></span><span class="row"><button class="btn sm" data-act="lab-load-script" data-id="${s.id}">Load</button><button class="btn sm ghost danger" data-act="lab-del-script" data-id="${s.id}">Delete</button></span></div>`).join('') : '<p class="muted small">No saved scripts yet.</p>'}</div>

  const g = projProgress(p), pct = Math.round(100 * g.done / g.total);
  return `<a class="card proj" href="#project-${p.id}"><div class="row between"><span class="code">${esc(p.code)} · ${esc(p.tag)}</span>${g.done === g.total ? '<span class="chip good">Done</span>' : `<span class="chip">${esc(p.hours)}</span>`}</div>
    <h3>${esc(p.title)}</h3><p class="muted small">${esc(p.summary)}</p><div class="bar"><i style="width:${pct}%"></i></div><span class="small muted">${g.done}/${g.total} steps · best for ${esc(p.role)}</span></a>`;
}

function ossFeedItems() {
  const seen = new Set(), dismissed = new Set(S.oss.dismissed || []), tracked = new Set((S.oss.contribs || []).map((c) => (c.issue || '').trim()));
  const out = [];
  for (const run of (ui.ossFeed || [])) for (const it of (Array.isArray(run.items) ? run.items : [])) {
    const url = safeUrl(it && it.url); if (!url || !/^https:\/\/github\.com\//.test(url) || seen.has(url)) continue; seen.add(url);
    out.push({ id: String(it.id || url), url, repo: String(it.repo || ''), title: String(it.title || 'Issue'), labels: (Array.isArray(it.labels) ? it.labels : []).map(String).slice(0, 4), age: String(it.age || ''), why: String(it.why || '') });
  }
  return out.filter((i) => !dismissed.has(i.id) && !tracked.has(i.url));
}

// ---------- Router, events, Lab engine, AI actions ----------
function parseRoute() {
  const h = (location.hash || '').slice(1) || 'home';
  if (h.startsWith('project-')) return { view: 'project', arg: h.slice(8) };
  return { view: NAV.some((n) => n[0] === h) ? h : 'home' };
}
function render() {
  const r = parseRoute(); const main = $('#main'); const top = main.scrollTop;
  renderRail(r.view);
  const V = { home: viewHome, roadmap: viewRoadmap, lab: viewLab, projects: viewProjects, coach: viewCoach, jobs: viewJobs, opensource: viewOpenSource, portfolio: viewPortfolio, toolkit: viewToolkit, profile: viewProfile };
  main.innerHTML = r.view === 'project' ? viewProject(r.arg) : V[r.view]();
  main.scrollTop = top;
  afterRender(r.view);
}
let lastView = null;
function afterRender(view) {
  if (view === 'lab') { const ed = $('#ed'); if (ed) { ed.addEventListener('keydown', editorKeys); ed.addEventListener('input', () => setDraft(ui.labEx, ed.value)); } ensureSql().catch(() => {}); }
  if (view === 'coach') { const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; const ci = $('#coachIn'); if (ci) { ci.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); coachSend(); } }); ci.addEventListener('input', () => { ui.coachDraft = ci.value; }); } }
  if (view === 'portfolio') updatePreview();
  if (view === 'roadmap' && ui.scrollWeek) { const el = $('#week-' + ui.scrollWeek); ui.scrollWeek = null; if (el) el.scrollIntoView({ block: 'start' }); }
  if (view !== lastView && view !== 'project') $('#main').scrollTop = 0;
  lastView = view;
}
window.addEventListener('hashchange', () => { $('#main').scrollTop = 0; render(); });

function setPath(path, value) {
  const parts = path.split('.'); const doc = parts.shift(); let o = S[doc];
  for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = value; save(doc);
}
let previewTimer = null;
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.bind) {
    let v = t.type === 'number' ? Number(t.value) || 0 : t.value;
    setPath(t.dataset.bind, v);
    if (t.dataset.bind === 'profile.name') renderRail(parseRoute().view);
    if (t.dataset.preview) { clearTimeout(previewTimer); previewTimer = setTimeout(updatePreview, 250); }
  }
  if (t.dataset.obind) {
    const c = S.oss.contribs.find((x) => x.id === t.dataset.id); if (c) { c[t.dataset.obind] = t.value; c.updated = Date.now(); save('oss'); }
  }
  if (t.dataset.jbind) {
    const j = S.jobs.list.find((x) => x.id === t.dataset.id); if (!j) return;
    j[t.dataset.jbind] = t.value; j.updated = Date.now(); save('jobs');
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.bind && t.dataset.render) render();
  if (t.dataset.obind === 'status') render();
  if (t.dataset.jbind === 'status') {
    const j = S.jobs.list.find((x) => x.id === t.dataset.id); if (!j) return;
    j.status = t.value; j.updated = Date.now();
    if (t.value === 'applied' && !j.applied) { j.applied = today(); if (!j.followUp) j.followUp = addDays(today(), 7); }
    save('jobs'); render();
  }
});

let SQLmod = null, baseBytes = null, sandboxDb = null, sqlLoading = null; const refCache = {};
function ensureSql() {

    for (let i = 0; i < 100 && typeof window.initSqlJs !== 'function'; i++) await new Promise((r) => setTimeout(r, 100));
    if (typeof window.initSqlJs !== 'function') throw new Error('The SQL engine did not load. Check your connection and reload the page.');
    SQLmod = await window.initSqlJs();
    const db = new SQLmod.Database(); db.exec(buildSeedSQL()); baseBytes = db.export(); db.close();
    sandboxDb = freshDb();
  })();
  sqlLoading.catch(() => { sqlLoading = null; });
  return sqlLoading;
}
function freshDb() { const d = new SQLmod.Database(baseBytes); d.run('PRAGMA foreign_keys = ON;'); return d; }
function lastResult(res) { return res.length ? res[res.length - 1] : null; }

  return `<div class="results"><table class="t"><thead><tr>${r.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((v) => v === null ? '<td class="null">NULL</td>' : typeof v === 'number' ? `<td class="num">${esc(Number.isInteger(v) ? v : Math.round(v * 10000) / 10000)}</td>` : `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function friendlyErr(msg) {
  const m = String(msg || '');
  let tip = '';
  if (/no such column/i.test(m)) tip = 'Check the column name and which table it belongs to (see the schema on the right). With joins, prefix it: o.order_date.';
  else if (/no such table/i.test(m)) tip = 'Check the table name in the schema panel.';
  else if (/syntax error/i.test(m)) tip = 'Look just before the word in quotes: a missing comma, a missing closing bracket, or a keyword in the wrong order (SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY).';
  else if (/ambiguous/i.test(m)) tip = 'Two joined tables have a column with this name. Prefix it with the table alias.';
  else if (/FOREIGN KEY/i.test(m)) tip = 'Another table still references these rows. Remove or change the child rows first.';
  else if (/misuse of aggregate/i.test(m)) tip = 'Aggregates (SUM, COUNT…) cannot go in WHERE. Use HAVING, or compute them in a subquery first.';
  return `<div class="verdict no"><b>Error:</b> ${esc(m)}${tip ? `<div class="small" style="margin-top:4px;font-weight:400">${esc(tip)}</div>` : ''}</div>`;
}
function showOut(html) { ui.labOut[ui.labEx] = html; const o = $('#labOut'); if (o) o.innerHTML = html; }
async function labRun() {

  showOut('<div class="verdict info">Loading the practice database…</div>');
  try { await ensureSql(); } catch (e) { showOut(friendlyErr(e.message)); return; }
  const ex = exById(ui.labEx);
  const db = ui.labEx === 'sandbox' ? sandboxDb : freshDb();
  const t0 = performance.now();
  try {
    const res = db.exec(sql); const ms = Math.round(performance.now() - t0); const r = lastResult(res);
    if (r) showOut(`<div class="row between small muted" style="margin-bottom:6px"><span>${r.values.length} row${r.values.length === 1 ? '' : 's'}${r.values.length > 200 ? ' (showing 200)' : ''} · ${ms} ms${res.length > 1 ? ` · showing the last of ${res.length} result sets` : ''}</span></div>${tableHtml(r)}`);
    else if (ex && ex.type === 'dml') { const v = lastResult(db.exec(ex.verify)); showOut(`<div class="verdict info">Statements ran (${db.getRowsModified()} row${db.getRowsModified() === 1 ? '' : 's'} changed by the last one). This is what the checker will look at:</div>${tableHtml(v, 50)}`); }
    else showOut(`<div class="verdict info">Done. ${db.getRowsModified()} row${db.getRowsModified() === 1 ? '' : 's'} changed by the last statement. ${ms} ms</div>`);

function normCell(v) {
  if (v === null || v === undefined) return '∅';
  if (typeof v === 'number') return (Math.round(v * 100) / 100).toFixed(2);
  if (/^-?\d+(\.\d+)?$/.test(v)) return (Math.round(Number(v) * 100) / 100).toFixed(2);

}
function rowsKey(r) { return (r ? r.values : []).map((row) => row.map(normCell).join('\u0001')); }

}
async function labCheck() {

  const sql = ed.value; setDraft(ex.id, sql);
  showOut('<div class="verdict info">Checking…</div>');
  try { await ensureSql(); } catch (e) { showOut(friendlyErr(e.message)); return; }
  const expected = refResult(ex); const db = freshDb(); let got;

    else got = lastResult(db.exec(sql));
  } catch (e) { db.close(); showOut(friendlyErr(e.message)); return; }

  else if (gcols !== ecols) verdict = `Expected ${ecols} column${ecols === 1 ? '' : 's'}, your query returns ${gcols}. Check which columns the task asks for.`;
  else if (gk.length !== ek.length) verdict = `Expected ${ek.length} row${ek.length === 1 ? '' : 's'}, your query returns ${gk.length}. Check your filters${ex.topic === 'joins' ? ' and join type' : ''}.`;

    if (same) ok = true;

    else { const mism = gk.findIndex((k) => !ek.includes(k)); verdict = `Right shape, but some values differ${mism >= 0 ? ` (for example your row ${mism + 1})` : ''}. Check your conditions, rounding and which rows are included.`; }
  }
  if (ok) {
    const first = !S.progress.solved[ex.id];
    S.progress.solved[ex.id] = { at: today(), sql }; save('progress');
    const next = EXERCISES.find((e) => !S.progress.solved[e.id]);
    ui.labOut[ex.id] = `<div class="verdict ok">Correct${first ? '. Nice work.' : ' again.'} ${ex.tsql ? '' : ''}</div>
      <div class="card tight flat"><p class="small"><b>In SQL Server:</b> ${esc(ex.tsql)}</p></div>${tableHtml(got, 50)}
      ${next ? `<div class="row" style="margin-top:8px"><button class="btn primary" data-act="lab-select" data-id="${next.id}">Next: ${esc(next.title)}</button></div>` : '<div class="verdict ok">That was the last unsolved exercise. Every Lab exercise is done.</div>'}`;
    render();
  } else {
    S.practice.mistakes[ex.id] = (S.practice.mistakes[ex.id] || 0) + 1; save('practice');
    showOut(`<div class="verdict no">${esc(verdict)}</div>${got ? `<p class="small muted" style="margin:8px 0 4px">Your result:</p>${tableHtml(got, 30)}` : ''}`);
  }
}
function editorKeys(e) {

function validateGen(list) {
  const good = [], bad = [];
  for (const ex of list) {
    if (!ex || !ex.title || !ex.prompt || !ex.solution) continue;
    const sql = String(ex.solution).replace(/--.*$/gm, '').trim();
    if (!/^(with|select)\b/i.test(sql) || /\b(insert|update|delete|drop|alter|create|pragma|attach)\b/i.test(sql)) { bad.push({ ex, error: 'The solution must be one read-only SELECT statement.' }); continue; }
    const db = freshDb();
    try {
      const res = db.exec(sql);
      if (res.length === 0) throw new Error('Returned 0 rows; it needs 1-200 rows.');
      if (res.length > 1) throw new Error('Contains more than one statement.');
      const n = res[0].values.length; if (n > 200) throw new Error('Returned ' + n + ' rows; it needs 1-200 rows.');
      good.push(ex);
    } catch (e) { bad.push({ ex, error: String(e.message) }); }
    finally { db.close(); }
  }
  return { good, bad };
}

  const j = S.jobs.list.find((x) => x.id === id); if (!j) return;
  if (!(j.ad || '').trim()) { ui.jobErr = { id, msg: 'Paste the job ad text first, then analyze it.' }; render(); return; }
  ui.jobErr = null;
  aiModal({ title: 'Analyze this job ad', prompt: taskPrompt(`JOB AD (${j.company || 'company not given'}, ${j.role || ''}):\n${j.ad.slice(0, 6000)}\n\nAnalyze this ad for her. Markdown with these bold labels:\n**Fit**: strong / medium / stretch, and why in 2 sentences.\n**What they really want**: 4-5 bullets in plain words.\n**Gaps to close**: up to 4, each with the fastest way to close it.\n**Keywords for your CV**: a comma-separated list using the ad's wording.\n**Projects to highlight**: which of her projects to mention, and how.\n**Questions they may ask**: 5 likely interview questions.\nUnder 400 words.`),
    paste: { label: 'Optional: paste the analysis here to keep it with this job', button: 'Save analysis', onImport: (text) => { j.analysis = text.slice(0, 20000); j.updated = Date.now(); save('jobs'); render(); return { ok: true, message: 'Analysis saved with this job' }; } } });
}
function genProject(ad, company, job) {
  ad = (ad || '').trim(); company = (company || '').trim();
  const fail = (msg) => { if (job) ui.jobErr = { id: job.id, msg }; else ui.genErr = msg; render(); };
  if (ad.length < 80) { fail('Paste the full job ad first (at least a few lines with the requirements).'); return; }
  ui.genErr = null; if (job) ui.jobErr = null;
  aiModal({ title: 'Design a tailored project', intro: '1. Open the chat and send the prompt. 2. Copy the whole answer. 3. Paste it below and the project appears in your Projects, with steps you can tick off.',
    prompt: taskPrompt(`JOB AD${company ? ' at ' + company : ''}:\n${ad.slice(0, 6000)}\n\nDesign ONE small portfolio project tailored to this job that she can finish in one or two weekends with free tools (SQL Server Developer edition, SSMS, Power BI Desktop, GitHub; Svelte only if the ad values frontend). It must mirror the company's domain and the ad's tech stack, use public or generated data (never the company's private data), and give her something specific to mention in the application.\n\nReply with ONLY this JSON and nothing else:\n{"title": "max 60 characters", "summary": "2 sentences", "why": "why this impresses this employer, 2 sentences", "skills": ["4-7 short items"], "hours": "e.g. 8–12 h", "steps": [{"t": "short imperative title", "d": "2-3 sentences of concrete instructions", "out": "deliverable"}], "readme": ["5-8 README section titles"], "talk": ["3-4 interview talking points"], "pitch": "one sentence for her application"}`),
    paste: { label: 'Paste the AI\'s full answer here', button: 'Add project', onImport: (text) => importTailored(text, company, job) } });
}
function importTailored(text, company, job) {
  const v = parseLooseJson(text);
  if (!v || !v.title || !Array.isArray(v.steps) || !v.steps.length) return { error: 'The project is missing a title or steps. Ask the AI to reply again with the complete JSON.' };
  const n = (S.projects.custom || []).length + 1;
  const p = { id: 'c' + uid(), code: 'T' + n, title: String(v.title).slice(0, 80), tag: 'Tailored' + (company ? ' · ' + company : ''), role: (job && job.role) || 'This specific job', summary: String(v.summary || ''), why: String(v.why || '') + (v.pitch ? ' Pitch for your application: "' + String(v.pitch) + '"' : ''),
    skills: (Array.isArray(v.skills) ? v.skills : []).map(String).slice(0, 8), hours: String(v.hours || '8–12 h'), steps: v.steps.slice(0, 8).map((s) => ({ t: String(s.t || s.title || 'Step'), d: String(s.d || s.detail || ''), out: String(s.out || s.deliverable || '') })),
    readme: (Array.isArray(v.readme) ? v.readme : ['Overview', 'How to run', 'Results']).map(String), talk: (Array.isArray(v.talk) ? v.talk : []).map(String), company, jobId: job ? job.id : null };
  S.projects.custom.push(p); save('projects');
  if (job) { job.projectId = p.id; job.updated = Date.now(); save('jobs'); }
  setTimeout(() => { location.hash = 'project-' + p.id; }, 50);
  return { ok: true, message: 'Tailored project added' };
}
function portfolioAi() {
  const done = allProjects().filter((p) => projProgress(p).done > 0).map((p) => p.title).join(', ') || 'projects in progress: clinic database, Polish public data analysis, Svelte app';
  aiModal({ title: 'Write your portfolio intro', prompt: taskPrompt(`Projects she has worked on: ${done}\n\nWrite her portfolio intro. Reply with ONLY this JSON: {"headline": "max 70 characters, role-focused, e.g. Junior SQL Developer · SQL Server, T-SQL, Power BI", "about": "60-90 words, first person, warm and specific, mentions her frontend internship as a strength, no clichés like passionate or hard-working"}`),
    paste: { label: 'Paste the AI\'s answer here', button: 'Use this intro', onImport: (text) => { const v = parseLooseJson(text); if (!v.headline && !v.about) return { error: 'No headline or about text found in that answer.' }; if (v.headline) S.portfolio.headline = String(v.headline).slice(0, 120); if (v.about) S.portfolio.about = String(v.about).slice(0, 1500); save('portfolio'); render(); return { ok: true, message: 'Intro updated' }; } } });
}
function ossAi(kind) {
  const text = (($('#ossText') || {}).value || '').trim();
  if (!text) { toast('Paste the issue, code or PR description first'); return; }
  const task = {
    explain: 'She pasted a GitHub issue (maybe with code) from an open source project. Explain in plain words: what the problem is; which part of the codebase is likely involved; the skills needed; an honest difficulty rating for a first contribution (easy / medium / hard); and a step-by-step plan for the fix, including how to test it. If it is too hard for a first contribution, say so kindly and describe what kind of issue to look for instead. Under 350 words.',
    claim: 'Draft a short GitHub comment (3-5 sentences, friendly, professional English) asking to work on this issue. Show she understood it, outline the planned approach in one or two sentences, and ask one clarifying question if useful. No over-apologising and no "I am a beginner" disclaimers. Put the comment in a code block so she can copy it, then at most two short tips.',
    pr: 'She pasted a draft pull request description (maybe with the diff). Review it against open source norms: a clear title, a link to the issue ("Fixes #123"), what changed and why, how it was tested, small scope. List the top improvements, then give a rewritten version in a code block.'
  }[kind];
  aiModal({ title: { explain: 'Explain this issue', claim: 'Draft your comment', pr: 'Review your PR description' }[kind], prompt: taskPrompt(`${task}\n\nWHAT SHE PASTED:\n${text.slice(0, 6000)}`) });
}

// ----- Extra click actions -----
Object.assign(ACTIONS, {
  'ai-pref': (el) => { S.profile.ai = el.dataset.ai; save('profile'); render(); },
  'coach-open': (el) => {
    const mode = el.dataset.mode, text = el.dataset.text;
    if (text.endsWith('\n\n')) { ui.coachMode = mode; ui.coachDraft = text; render(); const ci = $('#coachIn'); if (ci) { ci.focus(); ci.selectionStart = ci.value.length; } toast('Paste your text after the first line, then press "Open with my question"', 4500); return; }
    aiModal({ title: COACH_MODES[mode].name, prompt: coachPrompt(mode, text) });
  },
  'coach-own': () => { const t = ($('#coachIn').value || '').trim(); if (!t) { toast('Write your question first'); return; } const mode = $('#coachMode').value; ui.coachMode = mode; ui.coachDraft = t; aiModal({ title: COACH_MODES[mode].name, prompt: coachPrompt(mode, t) }); },
  'coach-start': (el) => { const mode = el.dataset.mode; if (mode === 'mock_sql') aiModal({ title: COACH_MODES.mock_sql.name, prompt: coachPrompt('mock_sql', COACH_MODES.mock_sql.starters[0]) }); else { ui.coachMode = mode; location.hash = 'coach'; } },
  'copy-progress': () => copyText(`Progress update from my study app (${fmtDate(today())}):\n\n${learnerContext()}`, 'Progress update'),
  'practice-q': (el) => { const mode = el.dataset.cat === 'Behavioral' ? 'mock_hr' : 'mock_sql'; aiModal({ title: 'Practise this question', prompt: coachPrompt(mode, `Ask me this interview question, wait for my answer, then give feedback and a model answer: "${el.dataset.q}"`) }); },
  'coach-practice-project': (el) => { const p = findProject(el.dataset.pid); aiModal({ title: 'Practise explaining your project', prompt: coachPrompt('mock_hr', `Interview me about my portfolio project "${p.title}" (${p.summary}). Ask one question at a time, like a real interviewer, and give feedback on how I explain it. Talking points I want to cover: ${p.talk.join('; ')}.`) }); },
  'pf-download': () => downloadFile('index.html', portfolioHtml(), 'text/html'),
  'backup-download': () => { downloadFile(`query-path-backup-${today()}.json`, backupJson(), 'application/json'); S.meta.lastBackup = today(); save('meta'); render(); toast('Backup downloaded. Keep it somewhere safe, like Google Drive or email it to yourself.', 5000); },
  'backup-pick': () => { const f = $('#importFile'); if (f) f.click(); },
  'feed-role': (el) => { ui.feedRole = el.dataset.role || null; render(); },
  'install': async () => {
    if (deferredInstall) { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { /* dismissed */ } deferredInstall = null; updateInstallBtn(); }
    else { location.hash = 'profile'; setTimeout(() => { const el = $('#installHelp'); if (el) el.scrollIntoView({ block: 'center' }); }, 100); }
  }
});
ACTIONS['export'] = () => copyText(backupJson(), 'Backup');
function backupJson() { const data = {}; DOC_KEYS.forEach((k) => { data[k] = S[k]; }); return JSON.stringify({ app: 'query-path', v: 2, savedAt: new Date().toISOString(), data }); }
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
document.addEventListener('change', (e) => {
  if (e.target.id !== 'importFile' || !e.target.files || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { const ta = $('#importTa'); if (ta) { ta.value = String(r.result || ''); ACTIONS['import'](); } };
  r.readAsText(e.target.files[0]); e.target.value = '';
});

// ----- Daily feeds (written by the GitHub Action into data/*.json) -----
const ROLE_GROUPS = [['Database', /database/i], ['Analyst & BI', /analyst|\bbi\b/i], ['Support', /support/i], ['Data engineer', /engineer/i], ['Trainee & graduate', /trainee|graduate|intern/i]];
function roleGroup(rt) { const g = ROLE_GROUPS.find(([, re]) => re.test(rt || '')); return g ? g[0] : 'Other'; }
function feedItems() {
  const seen = new Set(), dismissed = new Set(S.jobs.dismissed || []), tracked = new Set((S.jobs.list || []).map((j) => (j.link || '').trim()));
  const out = [];
  for (const run of (ui.feed || [])) for (const it of (Array.isArray(run.items) ? run.items : [])) {
    const url = safeUrl(it && it.url); if (!url || seen.has(url)) continue; seen.add(url);
    out.push({ title: String(it.title || 'Untitled role'), company: String(it.company || ''), city: String(it.city || ''), mode: String(it.mode || ''), summary: String(it.summary || ''), role_type: String(it.role_type || ''), firstSeen: String(it.firstSeen || ''), id: String(it.id || url), url });
  }
  return out.filter((i) => !dismissed.has(i.id) && !tracked.has(i.url)).sort((a, b) => (b.firstSeen > a.firstSeen ? 1 : b.firstSeen < a.firstSeen ? -1 : 0));
}
function isNewItem(i) { const prev = ui.feedVisitBaseline ?? S.meta.feedVisit ?? ''; return !!i.firstSeen && i.firstSeen > (prev || ''); }
function newFeedCount() { return feedItems().filter(isNewItem).length; }
function feedRow(i) {
  return `<div class="jobrow feedrow"><div class="who"><b>${esc(i.title)}</b><span class="small muted">${esc(i.company)}${i.city ? ' · ' + esc(i.city) : ''}${i.mode && i.mode !== 'unknown' ? ' · ' + esc(i.mode) : ''}</span></div>
    <span class="small muted">${isNewItem(i) ? '<span class="chip mark">New</span> ' : ''}${esc(i.summary)} ${i.role_type ? `<span class="chip acc">${esc(i.role_type)}</span>` : ''} ${i.firstSeen ? `<span class="chip">since ${esc(fmtDate(i.firstSeen))}</span>` : ''}</span>
    <span class="row"><a class="btn sm ghost" href="${esc(i.url)}" target="_blank" rel="noopener">Open</a><button class="btn sm primary" data-act="feed-add" data-url="${esc(i.url)}">Add to tracker</button><button class="btn sm ghost" data-act="feed-hide" data-id="${esc(i.id)}">Hide</button></span></div>`;
}
function feedSection() {
  const last = (ui.feed || [])[0];
  if (!last) {
    const msg = ui.feedState === 'error' ? 'Could not load the latest openings. Check your internet connection; the list comes back when you are online.'
      : ui.feedState === 'file' ? 'Openings appear when the app runs from its website address, not from a file on your computer.'
      : ui.feedState === 'ok' ? 'The daily job refresh has not run yet. It runs every morning; openings appear here after the first run.' : 'Loading openings…';
    return `<div class="card tight flat"><h3>New openings</h3><p class="small muted">${msg}</p></div>`;
  }
  const all = feedItems(), role = ui.feedRole, items = role ? all.filter((i) => roleGroup(i.role_type) === role) : all;
  const show = ui.feedAll ? items : items.slice(0, 10), nNew = all.filter(isNewItem).length;
  const groups = ROLE_GROUPS.map(([g]) => g).filter((g) => all.some((i) => roleGroup(i.role_type) === g));
  return `<div class="card"><div class="row between"><div class="stack" style="gap:2px"><h2>New openings</h2><span class="small muted">Refreshed daily from justjoin.it · last update ${esc(fmtDate(String(last.runAt || '').slice(0, 10)))}${last.region ? ' · ' + esc(String(last.region)) : ''}</span></div>
      <span class="row">${nNew ? `<span class="chip mark">${nNew} new since your last look</span>` : ''}<span class="chip ${all.length ? 'acc' : 'good'}">${all.length ? all.length + ' to review' : 'All reviewed'}</span></span></div>
    ${groups.length > 1 ? `<div class="row"><button class="chip ${!role ? 'sel' : ''}" data-act="feed-role" data-role="">All</button>${groups.map((g) => `<button class="chip ${role === g ? 'sel' : ''}" data-act="feed-role" data-role="${esc(g)}">${esc(g)}</button>`).join('')}</div>` : ''}
    <div>${items.length ? show.map(feedRow).join('') : '<p class="muted">Nothing to review here right now. New openings arrive with tomorrow morning\'s refresh.</p>'}</div>
    ${items.length > 10 ? `<button class="btn sm ghost" data-act="feed-all">${ui.feedAll ? 'Show fewer' : 'Show all ' + items.length}</button>` : ''}
    <p class="small muted">Openings come from justjoin.it only; pracuj.pl and No Fluff Jobs don't allow automated reading, so keep email alerts on there. Links expire after a few weeks.</p></div>`;
}
function ossWhy(repo) { for (const g of OSS_REPOS) for (const r of g.items) if (r.repo.toLowerCase() === String(repo || '').toLowerCase()) return r.name + ': ' + r.how; return ''; }
let feedLoadedAt = 0;
async function loadFeeds(force) {
  if (!force && Date.now() - feedLoadedAt < 20 * 60 * 1000) return;
  feedLoadedAt = Date.now();
  if (location.protocol === 'file:') { ui.feedState = 'file'; return; }
  const get = async (p) => { const r = await fetch(p + '?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
  try {
    const j = await get('data/jobs.json');
    ui.feed = j && (j.updatedAt || (j.items || []).length) ? [{ runAt: j.updatedAt || '', region: j.region || '', items: Array.isArray(j.items) ? j.items : [] }] : [];
    ui.feedState = 'ok';
  } catch (e) { ui.feedState = 'error'; }
  try {
    const o = await get('data/oss.json');
    ui.ossFeed = o && o.updatedAt ? [{ runAt: o.updatedAt, items: (Array.isArray(o.items) ? o.items : []).map((x) => ({ ...x, age: x.created ? 'opened ' + fmtDate(String(x.created).slice(0, 10)) : '', why: ossWhy(x.repo) })) }] : [];
  } catch (e) { /* optional */ }
  const v = parseRoute().view;
  if (['home', 'jobs', 'opensource'].includes(v) && !ui.openJob && !ui.addingJob && !document.querySelector('.dialog')) render();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadFeeds(); });

// ----- Today page with a backup reminder -----
function viewHome() {
  const has = solvedCount() > 0 || (S.jobs.list || []).length > 0 || Object.keys(S.progress.roadmap).length > 0;
  const last = S.meta.lastBackup, stale = !last || (new Date(today()) - new Date(last)) / 86400000 > 14;
  const card = has && stale ? `<div class="card flat"><div class="row between"><div class="stack"><h3>Back up your progress</h3><p class="muted small">Everything is saved in this browser. ${last ? 'Your last backup was ' + esc(fmtDate(last)) + '.' : 'You have no backup yet.'} A backup file protects it if the browser is cleared and lets you move to another device.</p></div><button class="btn primary" data-act="backup-download">Download backup</button></div></div>` : '';
  return viewHomeBase().replace('<div class="page">', '<div class="page">' + card);
}

      <div class="stack"><span class="small" style="font-weight:600;color:var(--muted)">Target roles</span><div class="row">${ROLE_OPTIONS.map((r) => `<button class="chip ${p.roles.includes(r) ? 'sel' : ''}" data-act="role-toggle" data-role="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>
      <label class="f">Background<textarea data-bind="profile.background">${esc(p.background)}</textarea></label>
      <label class="f">Skills (comma separated)<input type="text" data-bind="profile.skills" value="${esc(p.skills)}"></label>
      <label class="f">CV text (optional: the CV coach includes it automatically)<textarea data-bind="profile.cv" style="min-height:140px">${esc(p.cv)}</textarea></label></div>
    <div class="card"><h3>Your data and backups</h3>

      <p class="small"><b>${S.meta.lastBackup ? 'Last backup: ' + esc(fmtDate(S.meta.lastBackup)) : 'No backup yet'}</b></p>
      <div class="row"><button class="btn primary" data-act="backup-download">Download backup</button><button class="btn" data-act="backup-pick">Restore from a backup file</button><input type="file" id="importFile" accept=".json,application/json" hidden><button class="btn ghost danger" data-act="reset-all">Reset everything</button></div>
      <details><summary class="small muted" style="cursor:pointer">Other ways: copy and paste a backup</summary><div class="stack" style="margin-top:8px"><div class="row"><button class="btn sm" data-act="export">Copy backup text</button></div>
        <label class="f">Restore from pasted text<textarea id="importTa" placeholder="Paste a backup here…" style="min-height:60px"></textarea></label><div class="row"><button class="btn sm" data-act="import">Restore</button></div></div></details></div>
    <div class="card" id="installHelp"><h3>Install as an app</h3>
      <ul class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">
        <li><b>Laptop (Chrome or Edge):</b> the install icon at the right end of the address bar, or the "Install app" button in the menu on the left.</li>
        <li><b>Android (Chrome):</b> menu ⋮ → "Install app" or "Add to Home screen".</li>
        <li><b>iPhone (Safari):</b> Share button → "Add to Home Screen".</li></ul>
      <p class="small muted">Installed or not, it is the same app with the same saved data in that browser. The SQL Lab also works offline.</p></div>
  </div>`;
}

// ----- After each render -----
function afterRender(view) {
  if (view === 'lab') { const ed = $('#ed'); if (ed) { ed.addEventListener('keydown', editorKeys); ed.addEventListener('input', () => setDraft(ui.labEx, ed.value)); } ensureSql().catch(() => {}); }
  if (view === 'coach') { const ci = $('#coachIn'); if (ci) ci.addEventListener('input', () => { ui.coachDraft = ci.value; }); }
  if (view === 'portfolio') updatePreview();
  if (view === 'roadmap' && ui.scrollWeek) { const el = $('#week-' + ui.scrollWeek); ui.scrollWeek = null; if (el) el.scrollIntoView({ block: 'start' }); }
  if (view === 'jobs' && lastView !== 'jobs' && (ui.feed || []).length) {
    ui.feedVisitBaseline = S.meta.feedVisit || '';
    if (S.meta.feedVisit !== today()) { S.meta.feedVisit = today(); save('meta'); }
  }
  if (view !== 'jobs') ui.feedVisitBaseline = undefined;
  if (view !== lastView && view !== 'project') $('#main').scrollTop = 0;
  lastView = view;
  setSaveState();
}

// ----- Install & offline -----
let deferredInstall = null;
function updateInstallBtn() { const b = $('#installBtn'); if (b) b.hidden = !deferredInstall; }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; updateInstallBtn(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; updateInstallBtn(); toast('Installed. You can open Query Path from your apps now.', 4000); });

function bootWeb() {
  setSaveState();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  loadFeeds(true);
}

// ----- Start -----
loadLocal();
render();
bootWeb();
